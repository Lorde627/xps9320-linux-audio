# Factory MFX routing: 0.5 -> xover -> bass/3D group -> HF -> flat PEQ -> 2 -> dynamics.
# 48 kHz; final LSP True Peak/24 limiter, threshold 0.89.
context.modules = [ { name = libpipewire-module-filter-chain args = {
filter.graph = {
 nodes = [
  { type = builtin name = pre_l label = linear control = { Mult = 0.5 Add = 0 } }
  { type = lv2 name = xo plugin = "urn:xps9320:research-input-xover" }
  { type = lv2 name = g3d plugin = "urn:xps9320:research-3d-group-efficient" }
  { type = lv2 name = hf plugin = "urn:xps9320:research-hf-stage" }
  { type = builtin name = pre_r label = linear control = { Mult = 0.5 Add = 0 } }
  { type = lv2 name = dyn plugin = "urn:xps9320:research-dynamics-linux" control = { att_db = 0 } }
  { type = lv2 name = peq plugin = "urn:xps9320:research-flat-peq-efficient" }
  { type = builtin name = gain_l label = linear control = { Mult = 2 } }
  { type = builtin name = gain_r label = linear control = { Mult = 2 } }
  { type = lv2 name = lim plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo" control = { enabled = 1 g_in = 1 g_out = 1 th = 0.89 boost = 0 alr = 0 lk = 5 at = 1 rt = 20 ovs = 22 } }
 ]
 links = [
  { output = "pre_l:Out" input = "xo:in_l" }
  { output = "xo:out_l" input = "g3d:in_l" }
  { output = "g3d:out_l" input = "hf:in_l" }
  { output = "hf:out_l" input = "peq:in_l" }
  { output = "peq:out_l" input = "gain_l:In" }
  { output = "gain_l:Out" input = "dyn:in_l" }
  { output = "pre_r:Out" input = "xo:in_r" }
  { output = "xo:out_r" input = "g3d:in_r" }
  { output = "g3d:out_r" input = "hf:in_r" }
  { output = "hf:out_r" input = "peq:in_r" }
  { output = "peq:out_r" input = "gain_r:In" }
  { output = "gain_r:Out" input = "dyn:in_r" }
  { output = "dyn:out_l" input = "lim:in_l" }
  { output = "dyn:out_r" input = "lim:in_r" }
 ]
 inputs = [ "pre_l:In" "pre_r:In" ]
 outputs = [ "lim:out_l" "lim:out_r" ]
}
audio.channels = 2
 audio.position = [ FL FR ]
 audio.rate = 48000
 capture.props = {
  node.name = "effect_input.xps9320"
  node.description = "XPS 9320 — Linux endpoint-aware + true peak"
  media.class = Audio/Sink
  node.link-group = "xps9320_filter"
  filter.smart = true
  filter.smart.name = "xps9320"
  filter.smart.target = { node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Speaker__sink" }
  priority.session = -1
  channelmix.max-volume = 1.0
 }
 playback.props = {
  node.name = "effect_output.xps9320"
  node.passive = true
  node.link-group = "xps9320_filter"
  channelmix.max-volume = 1.0
 }
} } ]
