name: Build and regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc lv2-dev python3
      - name: Build 48 kHz plugins
        run: python3 scripts/build.py
      - name: Check DSP references and installation rollback
        run: python3 -m unittest discover -s tests -v
