# Card-specific UCM master for Dell XPS 9320 (XPS 13 Plus), longname DellInc.-XPS9320-0V0059
# Rationale: this machine physically has no camera/microphone module,
# so the stock HiFi verb (which registers a Mic device) fails ACP profile probing.
# ACP then only exposes "pro-audio", leaving the rt1316 amps muted.
# This master points the HiFi verb at HiFi-xps9320.conf (Speaker + HDMI only).
#
# To restore stock behaviour: delete this file and HiFi-xps9320.conf.

Syntax 8

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.led.File "/common/ctl/led.conf"

SectionUseCase."HiFi" {
	File "/sof-soundwire/HiFi-xps9320.conf"
	Comment "Play HiFi quality Music"
}
